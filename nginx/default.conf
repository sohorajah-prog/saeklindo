server {
    listen       80;
    server_name  localhost;

    # Frontend Vite (React) routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # PocketBase backend reverse proxy
    location /hcgi/platform/ {
        # Strip the /hcgi/platform prefix and forward the rest to pocketbase
        rewrite ^/hcgi/platform/(.*) /$1 break;
        proxy_pass http://pocketbase:8090;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        
        # Websocket support (PocketBase needs this for realtime connections)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Custom error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
